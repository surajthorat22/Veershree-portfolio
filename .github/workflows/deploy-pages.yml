name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "Missing GitHub Actions secret VITE_SERVER_URL (your Render API origin)."
            exit 1
          fi
          if [ -z "$VITE_BASE" ]; then
            export VITE_BASE="/"
          fi
          echo "Building with VITE_BASE=$VITE_BASE VITE_SERVER_URL=$VITE_SERVER_URL"
          pnpm --filter web build

      - name: SPA fallback + nojekyll
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
