# Local production-like API (auto-restarts on crash)
services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /var/data/uploads
      # Override weak local defaults when testing the image
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-change-me-32chars}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-ChangeMeLocal123!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - veershree_uploads:/var/data/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/rest/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  veershree_uploads:
